site_name: Inteligencia Artificial con Python
site_author: Victor Trigo

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue

plugins:
  - search
  - mkdocs-jupyter
  - enumerate-headings:
      include_markdown: true
      heading_depth: 2
nav:
  - Introducción: index.md
  - Entorno y Herramientas: environment/index.md
  - Programación: python/index.md
  - Datasets: datasets/index.md
  - Matemática: mathematics/index.md
  - Algebra Lineal: linear_algebra/index.md
  - Cálculo: calculus/index.md
  - Estadística: statistic/index.md
  - Probabilidades: probabilities/index.md
  - Inferencia: inference/index.md
  - Machine Learning: machine_learning/index.md
  - Deep Learning: deep_learning/index.md
  - Ingeniería: engineering/index.md
